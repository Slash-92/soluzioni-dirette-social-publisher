name: Notion Buffer sync

on:
  workflow_dispatch:
  schedule:
    - cron: "15 7 * * *"
      timezone: "Europe/Rome"

concurrency:
  group: soluzioni-dirette-buffer-sync
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NOTION_API_TOKEN: ${{ secrets.NOTION_API_TOKEN }}
      NOTION_DATA_SOURCE_ID: cea1e2e8-81ce-4733-a556-f4233df5d2b6
      BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
      BUFFER_INSTAGRAM_CHANNEL_ID: 6a943748065799be46542c4d
      BUFFER_FACEBOOK_CHANNEL_ID: 6a9443f6065799be465481e8
      BUFFER_SCHEDULE_HORIZON_DAYS: 10
      PUBLIC_MEDIA_BASE_URL: https://slash-92.github.io/soluzioni-dirette-social-publisher/media
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Test migration and idempotency rules
        run: node --test automation/notion-sync.test.mjs
      - name: Verify Notion configuration
        shell: bash
        run: |
          test -n "$NOTION_API_TOKEN" || { echo "::error::NOTION_API_TOKEN secret assente o non disponibile"; exit 1; }
      - name: Report Buffer configuration
        if: env.BUFFER_API_KEY == ''
        run: echo "::warning::BUFFER_API_KEY assente; i media possono essere preparati, ma le pubblicazioni Buffer entreranno in Errore."
      - name: Sync approved Notion content
        run: node automation/notion-sync.mjs
      - name: Save media and idempotency state
        if: always()
        run: |
          git add -- automation/notion-sync-state.json
          if [ -d media/notion ]; then
            git add -- media/notion
          fi
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "soluzioni-dirette-notion-bot"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "Sync approved Notion content"
          git pull --rebase origin main
          git push
